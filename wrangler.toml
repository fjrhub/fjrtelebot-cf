name = "fjrtelebot-cf"
main = "src/index.ts"
compatibility_date = "2024-01-01"

# ✅ Tambahkan ini untuk cron trigger
[triggers]
crons = ["0 0 * * *"]

[observability]
enabled = false
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issues]
enabled = true